<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Álbum da Laura</title>
    
    <!-- Importando as fontes -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,500;1,600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        /* Reset básico */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif; background-color: #040404; color: #fff;
            overflow-x: hidden; -webkit-tap-highlight-color: transparent; 
        }

        /* =========================================
           CABEÇALHO FIXO (DEGRADÊ + DESFOQUE PROGRESSIVO INVERTIDO)
           ========================================= */
        .sticky-header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 180px; 
            z-index: 500; 
            display: flex;
            align-items: flex-start;
            padding: 40px 20px 20px 20px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.6s ease; 
        }

        .sticky-header.visible {
            opacity: 1;
            pointer-events: auto;
        }

        /* Desfoque progressivo (Forte no topo, some no final) */
        .sticky-blur { position: absolute; z-index: -2; inset: 0; pointer-events: none; }
        .sticky-blur > div, .sticky-blur::before, .sticky-blur::after { position: absolute; inset: 0; }
        .sticky-blur::before { content: ""; z-index: 1; -webkit-backdrop-filter: blur(64px); backdrop-filter: blur(64px); mask: linear-gradient(to bottom, black 0%, black 12.5%, rgba(0,0,0,0) 25%); }
        .sticky-blur > div:nth-of-type(1) { z-index: 2; -webkit-backdrop-filter: blur(32px); backdrop-filter: blur(32px); mask: linear-gradient(to bottom, rgba(0,0,0,0) 0%, black 12.5%, black 25%, rgba(0,0,0,0) 37.5%); }
        .sticky-blur > div:nth-of-type(2) { z-index: 3; -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); mask: linear-gradient(to bottom, rgba(0,0,0,0) 12.5%, black 25%, black 37.5%, rgba(0,0,0,0) 50%); }
        .sticky-blur > div:nth-of-type(3) { z-index: 4; -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); mask: linear-gradient(to bottom, rgba(0,0,0,0) 25%, black 37.5%, black 50%, rgba(0,0,0,0) 62.5%); }
        .sticky-blur > div:nth-of-type(4) { z-index: 5; -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px); mask: linear-gradient(to bottom, rgba(0,0,0,0) 37.5%, black 50%, black 62.5%, rgba(0,0,0,0) 75%); }
        .sticky-blur > div:nth-of-type(5) { z-index: 6; -webkit-backdrop-filter: blur(2px); backdrop-filter: blur(2px); mask: linear-gradient(to bottom, rgba(0,0,0,0) 50%, black 62.5%, black 75%, rgba(0,0,0,0) 87.5%); }
        .sticky-blur > div:nth-of-type(6) { z-index: 7; -webkit-backdrop-filter: blur(1px); backdrop-filter: blur(1px); mask: linear-gradient(to bottom, rgba(0,0,0,0) 62.5%, black 75%, black 87.5%, rgba(0,0,0,0) 100%); }
        .sticky-blur::after { content: ""; z-index: 8; -webkit-backdrop-filter: blur(0.5px); backdrop-filter: blur(0.5px); mask: linear-gradient(to bottom, rgba(0,0,0,0) 75%, black 87.5%, black 100%); }

        /* A sombra preta suave por cima do desfoque */
        .sticky-overlay {
            position: absolute; z-index: -1; inset: 0; pointer-events: none;
            background: linear-gradient(to bottom, rgba(0, 0, 0, 0.95) 0%, rgba(0, 0, 0, 0.65) 40%, rgba(0, 0, 0, 0.20) 70%, rgba(0, 0, 0, 0) 100%);
        }

        .sticky-title {
            font-family: 'Playfair Display', serif;
            font-size: 1.5rem;
            font-style: italic;
            font-weight: 500;
            color: #fff;
            text-shadow: 0 2px 5px rgba(0,0,0,0.8);
            letter-spacing: 0.5px;
            position: relative;
            z-index: 10;
        }

        /* =========================================
           ANIMAÇÕES CINEMATOGRÁFICAS DA CAPA
           ========================================= */
        @keyframes pullFocus { 0% { opacity: 1; transform: scale(1.08); } 100% { opacity: 0; transform: scale(1); } }
        @keyframes fadeLight { 0% { background-color: rgba(0, 0, 0, 0.8); } 100% { background-color: rgba(0, 0, 0, 0); } }
        @keyframes textSlideUp { 0% { opacity: 0; transform: translateY(20px); filter: blur(5px); } 100% { opacity: 1; transform: translateY(0); filter: blur(0); } }
        @keyframes growLine { 0% { transform: scaleY(0); opacity: 0; } 100% { transform: scaleY(1); opacity: 1; } }

        /* =========================================
           CAPA DO ÁLBUM E DESFOQUE DA BASE
           ========================================= */
        .album-cover { position: relative; width: 100%; height: 80vh; display: flex; flex-direction: column; justify-content: flex-end; overflow: hidden; }
        .bg-clear, .bg-blurred { position: absolute; inset: 0; background-size: cover; background-position: center; }
        
        .bg-clear { z-index: 0; background-image: url('https://scontent.fmab1-1.fna.fbcdn.net/v/t1.15752-9/720721437_1840766453995867_8844413317882211323_n.jpg?stp=dst-jpg_s960x960_tt6&_nc_cat=108&ccb=1-7&_nc_sid=9f807c&_nc_ohc=Iv2YByUOHT4Q7kNvwFrzkGR&_nc_oc=AdqKZPP5qTnu0_dFIJqwlsyz3Nk2Tx30cD80ZBydROZxcD-aq7tkfRvF9eYfIv_tXMQ&_nc_zt=23&_nc_ht=scontent.fmab1-1.fna&_nc_ss=7b6a8&oh=03_Q7cD5wELDfw4TcDLOP9UnOzPba-eSIm2QSsljANSyU-f8Q_arA&oe=6A7CF3B4'); }
        .bg-blurred {
            z-index: 1; filter: blur(25px); animation: pullFocus 3s cubic-bezier(0.25, 1, 0.5, 1) forwards;
            background-image: url('https://scontent.fmab1-1.fna.fbcdn.net/v/t1.15752-9/720721437_1840766453995867_8844413317882211323_n.jpg?stp=dst-jpg_s960x960_tt6&_nc_cat=108&ccb=1-7&_nc_sid=9f807c&_nc_ohc=Iv2YByUOHT4Q7kNvwFrzkGR&_nc_oc=AdqKZPP5qTnu0_dFIJqwlsyz3Nk2Tx30cD80ZBydROZxcD-aq7tkfRvF9eYfIv_tXMQ&_nc_zt=23&_nc_ht=scontent.fmab1-1.fna&_nc_ss=7b6a8&oh=03_Q7cD5wELDfw4TcDLOP9UnOzPba-eSIm2QSsljANSyU-f8Q_arA&oe=6A7CF3B4');
        }
        .initial-darkness { position: absolute; inset: 0; z-index: 2; pointer-events: none; animation: fadeLight 2.5s ease-in-out forwards; }
        .gradient-blur { position: absolute; z-index: 3; inset: auto 0 0 0; height: 60%; pointer-events: none; }
        .gradient-blur > div, .gradient-blur::before, .gradient-blur::after { position: absolute; inset: 0; }
        .gradient-blur::before { content: ""; z-index: 1; -webkit-backdrop-filter: blur(0.5px); backdrop-filter: blur(0.5px); mask: linear-gradient(to bottom, rgba(0,0,0,0) 0%, black 12.5%, black 25%, rgba(0,0,0,0) 37.5%); }
        .gradient-blur > div:nth-of-type(1) { z-index: 2; -webkit-backdrop-filter: blur(1px); backdrop-filter: blur(1px); mask: linear-gradient(to bottom, rgba(0,0,0,0) 12.5%, black 25%, black 37.5%, rgba(0,0,0,0) 50%); }
        .gradient-blur > div:nth-of-type(2) { z-index: 3; -webkit-backdrop-filter: blur(2px); backdrop-filter: blur(2px); mask: linear-gradient(to bottom, rgba(0,0,0,0) 25%, black 37.5%, black 50%, rgba(0,0,0,0) 62.5%); }
        .gradient-blur > div:nth-of-type(3) { z-index: 4; -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px); mask: linear-gradient(to bottom, rgba(0,0,0,0) 37.5%, black 50%, black 62.5%, rgba(0,0,0,0) 75%); }
        .gradient-blur > div:nth-of-type(4) { z-index: 5; -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); mask: linear-gradient(to bottom, rgba(0,0,0,0) 50%, black 62.5%, black 75%, rgba(0,0,0,0) 87.5%); }
        .gradient-blur > div:nth-of-type(5) { z-index: 6; -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); mask: linear-gradient(to bottom, rgba(0,0,0,0) 62.5%, black 75%, black 87.5%, rgba(0,0,0,0) 100%); }
        .gradient-blur > div:nth-of-type(6) { z-index: 7; -webkit-backdrop-filter: blur(32px); backdrop-filter: blur(32px); mask: linear-gradient(to bottom, rgba(0,0,0,0) 75%, black 87.5%, black 100%); }
        .gradient-blur::after { content: ""; z-index: 8; -webkit-backdrop-filter: blur(64px); backdrop-filter: blur(64px); mask: linear-gradient(to bottom, rgba(0,0,0,0) 87.5%, black 100%); }
        .dark-overlay { position: absolute; z-index: 4; inset: auto 0 0 0; height: 75%; background: linear-gradient(to bottom, rgba(0,0,0,0) 0%, rgba(0,0,0,0.7) 70%, rgba(0,0,0,1) 100%); pointer-events: none; }
        
        .text-content { position: relative; z-index: 10; padding: 0 30px; margin-bottom: 30px; }
        .title { font-family: 'Playfair Display', serif; font-size: 5.5rem; font-style: italic; font-weight: 500; margin-bottom: 15px; letter-spacing: -1px; line-height: 1; text-shadow: 0 2px 10px rgba(0,0,0,0.3); opacity: 0; animation: textSlideUp 1.2s cubic-bezier(0.25, 1, 0.5, 1) 0.8s forwards; }
        .info-box { position: relative; padding-left: 15px; margin-left: 5px; }
        .info-box::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 2px; background-color: rgba(255, 255, 255, 0.8); transform-origin: top; opacity: 0; transform: scaleY(0); animation: growLine 1s cubic-bezier(0.25, 1, 0.5, 1) 1.2s forwards; }
        .subtitle { font-size: 1.3rem; font-weight: 600; text-transform: uppercase; letter-spacing: 2px; opacity: 0; animation: textSlideUp 1.2s cubic-bezier(0.25, 1, 0.5, 1) 1.5s forwards; }

        /* =========================================
           GRADE DE FOTOS
           ========================================= */
        .photo-gallery { padding: 10px 15px 40px 15px; display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; max-width: 1200px; margin: 0 auto; }
        .grid-item { position: relative; width: 100%; aspect-ratio: 3 / 4; border-radius: 14px; background-color: #111; background-size: cover; background-position: center; box-shadow: 0 4px 10px rgba(0,0,0,0.3); cursor: pointer; transition: transform 0.2s ease; }
        .grid-item:active { transform: scale(0.96); }
        .footer-love { text-align: center; padding: 20px 20px 60px 20px; font-size: 0.95rem; color: #888; font-weight: 300; }

        /* =========================================
           LIGHTBOX E ANIMAÇÕES (QUANDO ABRE FOTO)
           ========================================= */
        .lightbox { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.98); z-index: 1000; display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.4s ease; }
        .lightbox.active { opacity: 1; pointer-events: auto; }
        .lightbox-content { position: relative; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
        .lightbox img { max-width: 100%; max-height: 85%; object-fit: contain; border-radius: 8px; cursor: pointer; transition: opacity 0.4s ease, transform 0.4s cubic-bezier(0.25, 1, 0.5, 1), filter 0.4s ease; }
        .img-visible { opacity: 1; transform: scale(1) translateX(0); filter: blur(0px); }
        .img-hidden-center { opacity: 0; transform: scale(0.9); filter: blur(15px); }
        .img-hidden-left { opacity: 0; transform: scale(0.95) translateX(-60px); filter: blur(12px); }
        .img-hidden-right { opacity: 0; transform: scale(0.95) translateX(60px); filter: blur(12px); }

        /* =========================================
           PÍLULAS COM DESFOQUE E GLOW FIXO
           ========================================= */
        .bottom-controls {
            position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 12px; align-items: center; z-index: 1001;
            transition: opacity 0.3s ease, transform 0.3s ease; display: none; max-width: 95vw; 
        }

        .info-pill {
            background: rgba(45, 40, 38, 0.55); 
            -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
            padding: 0 20px; border-radius: 22px; display: flex; align-items: center; gap: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3); height: 56px; box-sizing: border-box; cursor: pointer;
            transition: box-shadow 0.4s ease, background 0.4s ease;
        }
        .info-pill.glow-active {
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.45); 
            background: rgba(70, 65, 60, 0.7); 
        }

        .pill-dot { width: 5px; height: 5px; background-color: #d1d1d1; border-radius: 50%; flex-shrink: 0; }
        .pill-text { display: flex; flex-direction: column; justify-content: center; gap: 2px; }
        .pill-date { color: #fff; font-size: 0.95rem; font-weight: 500; line-height: 1; white-space: nowrap; }
        .pill-time { color: #b0b0b0; font-size: 0.85rem; font-weight: 400; line-height: 1; white-space: nowrap; }

        .download-btn {
            background: rgba(45, 40, 38, 0.55); -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
            border-radius: 20px; width: 56px; height: 56px; flex-shrink: 0; display: flex; align-items: center; justify-content: center;
            border: none; color: white; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: background 0.2s ease, transform 0.2s ease, box-shadow 0.3s ease;
        }
        .download-btn:active { transform: scale(0.95); box-shadow: 0 0 25px rgba(255, 255, 255, 0.25); background: rgba(60, 55, 53, 0.65); }

        .lightbox-btn { position: absolute; background: rgba(255, 255, 255, 0.15); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); color: white; border: none; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; z-index: 1001; transition: opacity 0.3s ease, transform 0.3s ease; }
        .btn-close { top: 25px; right: 25px; width: 42px; height: 42px; }
        .btn-nav { top: 50%; transform: translateY(-50%); width: 50px; height: 50px; font-size: 20px; }
        .btn-prev { left: 20px; }
        .btn-next { right: 20px; }

        .lightbox.ui-hidden .lightbox-btn, .lightbox.ui-hidden .bottom-controls { opacity: 0 !important; pointer-events: none; transform: translateY(10px) translateX(-50%); }
        .lightbox.ui-hidden .btn-close { transform: translateY(-5px) scale(0.9); }
        .lightbox.ui-hidden .btn-nav { transform: translateY(-50%) scale(0.9); }

        @media (max-width: 480px) {
            .title { font-size: 4.5rem; }
            .subtitle { font-size: 1.2rem; }
            .photo-gallery { gap: 10px; padding: 10px 15px 30px 15px; }
            .btn-nav { display: none; }
            .btn-close { top: 20px; right: 20px; width: 38px; height: 38px; }
            .bottom-controls { bottom: 30px; transform: translateX(-50%) scale(0.95); }
        }
    </style>
</head>

    <!-- O CABEÇALHO FIXO COM DEGRADÊ E DESFOQUE PROGRESSIVO (ESTILO APPLE) -->
    <div class="sticky-header" id="sticky-header">
        <div class="sticky-blur"><div></div><div></div><div></div><div></div><div></div><div></div></div>
        <div class="sticky-overlay"></div>
        <h2 class="sticky-title">Álbum da Laura</h2>
    </div>

    <!-- CAPA -->
    <header class="album-cover">
        <div class="bg-clear"></div>
        <div class="bg-blurred"></div>
        <div class="initial-darkness"></div>
        <div class="gradient-blur"><div></div><div></div><div></div><div></div><div></div><div></div></div>
        <div class="dark-overlay"></div>
        <div class="text-content">
            <h1 class="title">Laura</h1>
            <div class="info-box"><p class="subtitle">Princesa</p></div>
        </div>
    </header>

    <div class="footer-love">Feito com amor para a Laura 🩷</div>

    <!-- O LIGHTBOX (GALERIA ABERTA) -->
    <div class="lightbox" id="lightbox">
        <button class="lightbox-btn btn-close" id="btn-close">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>

        <button class="lightbox-btn btn-nav btn-prev" onclick="mudarFoto('prev', event)">&#10094;</button>
        
        <div class="lightbox-content" id="lightbox-content">
            <img src="" alt="Foto expandida" id="lightbox-img" class="img-hidden-center">
            
            <div class="bottom-controls" id="bottom-controls">
                <div class="info-pill" id="info-pill">
                    <div class="pill-dot"></div>
                    <div class="pill-text">
                        <span class="pill-date" id="pill-date"></span>
                        <span class="pill-time" id="pill-time"></span>
                    </div>
                </div>
                
                <button class="download-btn" id="download-btn" title="Baixar Foto">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                </button>
            </div>
        </div>

        <button class="lightbox-btn btn-nav btn-next" onclick="mudarFoto('next', event)">&#10095;</button>
    </div>

    <!-- SCRIPT -->
    <script>
        // CONTROLE DA BARRA FIXA (STICKY HEADER)
        const stickyHeader = document.getElementById('sticky-header');
        window.addEventListener('scroll', () => {
            const alturaTela = window.innerHeight;
            if (window.scrollY > alturaTela * 0.5) {
                stickyHeader.classList.add('visible');
            } else {
                stickyHeader.classList.remove('visible');
            }
        });

        const gridItems = document.querySelectorAll('.grid-item');
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightbox-img');
        const bottomControls = document.getElementById('bottom-controls');
        const pillDate = document.getElementById('pill-date');
        const pillTime = document.getElementById('pill-time');
        const btnClose = document.getElementById('btn-close');
        const infoPill = document.getElementById('info-pill');
        const downloadBtn = document.getElementById('download-btn');
        
        let indiceAtual = 0;
        let imagensDados = [];

        gridItems.forEach((item, index) => {
            imagensDados.push({
                src: item.getAttribute('data-src'),
                date: item.getAttribute('data-date'),
                time: item.getAttribute('data-time')
            });
            item.addEventListener('click', () => abrirFoto(index));
        });

        function desligarGlow() {
            infoPill.classList.remove('glow-active');
        }

        function atualizarPilula() {
            const data = imagensDados[indiceAtual].date;
            const hora = imagensDados[indiceAtual].time;
            
            desligarGlow();

            if (data && data.trim() !== "") {
                pillDate.innerText = data;
                
                if(hora && hora.trim() !== "") {
                    pillTime.innerText = hora;
                    pillTime.style.display = 'block';
                } else {
                    pillTime.style.display = 'none';
                }

                bottomControls.style.display = 'flex'; 
                setTimeout(() => bottomControls.style.opacity = '1', 10);
            } else {
                bottomControls.style.opacity = '0';
                setTimeout(() => bottomControls.style.display = 'none', 300); 
            }
        }

        function abrirFoto(index) {
            indiceAtual = index;
            lightboxImg.src = imagensDados[indiceAtual].src;
            atualizarPilula();
            
            lightbox.classList.remove('ui-hidden');
            lightboxImg.className = 'img-hidden-center';
            lightbox.classList.add('active');

            setTimeout(() => {
                lightboxImg.className = 'img-visible';
            }, 50);
        }

        btnClose.addEventListener('click', (e) => {
            e.stopPropagation();
            desligarGlow();
            lightbox.classList.remove('active');
        });

        lightbox.addEventListener('click', (e) => {
            if(e.target === lightbox || e.target === document.getElementById('lightbox-content')) {
                desligarGlow();
                lightbox.classList.remove('active');
            }
        });

        lightboxImg.addEventListener('click', (e) => {
            e.stopPropagation();
            desligarGlow(); 
            lightbox.classList.toggle('ui-hidden');
        });

        infoPill.addEventListener('click', (e) => {
            e.stopPropagation(); 
            infoPill.classList.toggle('glow-active'); 
        });

        function mudarFoto(direcao, event) {
            if(event) event.stopPropagation(); 
            
            if (direcao === 'next' && indiceAtual < imagensDados.length - 1) {
                transicaoSuave('esquerda', indiceAtual + 1);
            } else if (direcao === 'prev' && indiceAtual > 0) {
                transicaoSuave('direita', indiceAtual - 1);
            }
        }

        function transicaoSuave(sentido, novoIndice) {
            lightboxImg.className = sentido === 'esquerda' ? 'img-hidden-left' : 'img-hidden-right';
            bottomControls.style.opacity = '0'; 
            
            setTimeout(() => {
                indiceAtual = novoIndice;
                lightboxImg.src = imagensDados[indiceAtual].src;
                atualizarPilula();
                
                lightboxImg.className = sentido === 'esquerda' ? 'img-hidden-right' : 'img-hidden-left';
                
                setTimeout(() => {
                    lightboxImg.className = 'img-visible';
                }, 50);
                
            }, 300); 
        }

        downloadBtn.addEventListener('click', async (e) => {
            e.stopPropagation(); 
            desligarGlow(); 

            const imgSrc = imagensDados[indiceAtual].src;
            try {
                const response = await fetch(imgSrc);
                const blob = await response.blob();
                const url = window.URL.createObjectURL(blob);
                
                const a = document.createElement('a');
                a.style.display = 'none';
                a.href = url;
                const nomeData = imagensDados[indiceAtual].date ? imagensDados[indiceAtual].date.replace(/ /g, '_') : 'Foto';
                a.download = `Laura_${nomeData}.jpg`; 
                
                document.body.appendChild(a);
                a.click();
                
                window.URL.revokeObjectURL(url);
                document.body.removeChild(a);
            } catch (error) {
                window.open(imgSrc, '_blank');
            }
        });

        /* Swipe em Celular */
        let touchStart = 0;
        let touchEnd = 0;
        const conteudoLightbox = document.getElementById('lightbox-content');

        conteudoLightbox.addEventListener('touchstart', e => {
            touchStart = e.changedTouches[0].screenX;
        }, {passive: true});

        conteudoLightbox.addEventListener('touchend', e => {
            touchEnd = e.changedTouches[0].screenX;
            lidarComSwipe();
        }, {passive: true});

        function lidarComSwipe() {
            const distanciaMinima = 50; 
            if (touchEnd < touchStart - distanciaMinima) mudarFoto('next');
            if (touchEnd > touchStart + distanciaMinima) mudarFoto('prev');
        }
    </script>
